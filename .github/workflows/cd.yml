name: CD - Production Deployment to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ── Deploy to AWS EC2 ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          envs: GITHUB_REF_NAME
          script: |
            TARGET_BRANCH="${{ github.event.inputs.branch || 'main' }}"
            echo "=================================================="
            echo "🚀 Starting Production Deployment on branch: ${TARGET_BRANCH}"
            echo "=================================================="
            
            # Find and navigate to application directory (case-insensitive search)
            if [ -d "$HOME/Cortex" ]; then
              cd "$HOME/Cortex"
            elif [ -d "$HOME/cortex" ]; then
              cd "$HOME/cortex"
            elif [ -f "$HOME/docker-compose.yml" ]; then
              cd "$HOME"
            elif [ -d "/var/www/cortex" ]; then
              cd "/var/www/cortex"
            else
              # Search for docker-compose.yml in home directory
              FOUND_DIR=$(find "$HOME" -maxdepth 2 -name "docker-compose.yml" -exec dirname {} \; | head -n 1)
              if [ -n "$FOUND_DIR" ] && [ -d "$FOUND_DIR" ]; then
                cd "$FOUND_DIR"
              else
                echo "❌ Current directory contents in $HOME:"
                ls -la "$HOME"
                echo "❌ Error: Cortex directory not found on server!"
                exit 1
              fi
            fi
            
            echo "📂 Active server directory: $(pwd)"
            
            # Fetch and checkout latest merged code
            echo "⬇️  Pulling latest changes from origin/${TARGET_BRANCH}..."
            git fetch origin "${TARGET_BRANCH}"
            git checkout "${TARGET_BRANCH}"
            git pull origin "${TARGET_BRANCH}"
            
            # Rebuild and start Docker containers
            echo "🐳 Rebuilding and starting Docker containers..."
            docker compose down || true
            docker compose up --build -d --remove-orphans
            
            # Clean up dangling images to prevent disk fill-up
            echo "🧹 Pruning old Docker images..."
            docker image prune -f
            
            # Show container status
            echo "📊 Active containers:"
            docker compose ps
            
            echo "=================================================="
            echo "✅ Production Deployment finished successfully!"
            echo "=================================================="
